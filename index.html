<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lập Lịch Bóng Đá - Mini League</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { 
            background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); 
            color: white; 
            min-height: 100vh; 
        }
        .card { 
            background: rgba(255,255,255,0.08); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(255,255,255,0.1); 
        }
        .btn-primary { 
            background: #00ff88; 
            color: #0f172a; 
            font-weight: bold; 
        }
        .btn-outline-light:hover {
            background: rgba(255,255,255,0.1);
        }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center mb-5">
            <h1 class="display-4 fw-bold"><i class="fas fa-futbol me-3"></i>LẬP LỊCH BÓNG ĐÁ</h1>
            <p class="lead">Mini League Scheduler</p>
        </div>

        <div class="row justify-content-center">
            <div class="col-lg-8">
                <div class="card p-5 shadow">
                    
                    <!-- Phần Download File Mẫu -->
                    <div class="mb-4">
                        <label class="form-label fw-bold">Tải file mẫu từ hệ thống</label>
                        <div class="input-group">
                            <select class="form-select bg-dark text-white border-secondary" id="templateSelect">
                                {% for t in templates %}
                                <option value="{{ t }}">{{ t }}</option>
                                {% endfor %}
                            </select>
                            <button class="btn btn-outline-light" type="button" onclick="downloadSelectedTemplate()">
                                <i class="fas fa-download me-2"></i>Tải về
                            </button>
                        </div>
                        <small class="d-block text-light mt-2 text-center">Chọn file .json trong thư mục data để tham khảo cấu trúc</small>
                    </div>

                    <hr class="my-4">

                    <form action="/run" method="post" enctype="multipart/form-data" id="mainForm">
                        <div class="mb-4">
                            <label class="form-label fw-bold">1. Tải lên file dữ liệu JSON của bạn</label>
                            <input type="file" name="file" id="fileInput" class="form-control" accept=".json" required>
                        </div>

                        <div class="mb-4">
                            <label class="form-label fw-bold">2. Chọn thuật toán tối ưu</label>
                            <div class="row g-3">
                                <div class="col-md-6">
                                    <div class="form-check card p-3">
                                        <input class="form-check-input" type="radio" name="algorithm" value="ga" id="ga" checked>
                                        <label class="form-check-label" for="ga">
                                            <strong>Genetic Algorithm</strong><br>
                                            <small class="text-light">Đơn mục tiêu • Tốc độ nhanh</small>
                                        </label>
                                    </div>
                                </div>
                                <div class="col-md-6">
                                    <div class="form-check card p-3">
                                        <input class="form-check-input" type="radio" name="algorithm" value="nsga2" id="nsga2">
                                        <label class="form-check-label" for="nsga2">
                                            <strong>NSGA-II</strong><br>
                                            <small class="text-light">Đa mục tiêu • Công bằng + Phát sóng</small>
                                        </label>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary btn-lg w-100 py-3" id="runBtn">
                            <i class="fas fa-play me-2"></i>BẮT ĐẦU TÍNH TOÁN
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.getElementById('mainForm').onsubmit = function() {
            const btn = document.getElementById('runBtn');
            btn.innerHTML = `<span class="spinner-border spinner-border-sm me-2"></span>Đang tính toán...`;
            btn.disabled = true;
        };

        function downloadSelectedTemplate() {
            const select = document.getElementById('templateSelect');
            const filename = select.value;
            if (filename) {
                window.location.href = `/download/template/${filename}`;
            }
        }
    </script>
</body>
</html>
