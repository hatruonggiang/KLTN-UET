<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kết quả - Lập Lịch Bóng Đá</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: linear-gradient(135deg, #0f172a 0%, #1e2937 100%); color: white; min-height: 100vh; }
        .success-card { background: rgba(0,255,136,0.1); border: 2px solid #00ff88; }
    </style>
</head>
<body>
    <div class="container py-5">
        <div class="text-center">
            <h2 class="text-success"><i class="fas fa-check-circle fa-3x"></i></h2>
            <h3 class="mt-3">Hoàn tất!</h3>
            <p>Thuật toán <strong>{{ algo }}</strong> đã hoàn tất việc tính toán.</p>

            <div class="row justify-content-center mt-4">
                {% for res in results %}
                <div class="col-md-4 mb-4">
                    <div class="success-card p-4 rounded-4 h-100 d-flex flex-column text-start">
                        <h5 class="text-success mb-3"><i class="fas fa-award me-2"></i>{{ res.label }}</h5>
                        <p class="mb-1">Fitness: <strong>{{ res.fitness }}</strong></p>
                        {% if res.objectives %}
                        <p class="small text-info mb-2">{{ res.objectives }}</p>
                        {% endif %}
                        <p class="small text-light mb-0">Số trận: {{ res.num_matches }} | Đội: {{ res.num_teams }}</p>
                        
                        <div class="mt-auto pt-3">
                            <a href="/download/{{ res.filename }}" class="btn btn-success w-100 mb-2">
                                <i class="fas fa-download me-2"></i>Tải .JSON
                            </a>
                            <a href="/schedule/{{ res.filename }}" class="btn btn-outline-light w-100">
                                <i class="fas fa-table me-2"></i>Xem chi tiết
                            </a>
                        </div>
                    </div>
                </div>
                {% endfor %}
            </div>

            <div class="mt-4">
                <a href="/" class="btn btn-outline-secondary px-5">Lập lịch mới</a>
            </div>
        </div>
    </div>
</body>
</html>
