<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lịch Thi Đấu Chi Tiết</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; }
        .match-row { transition: all 0.3s; }
        .match-row:hover { background: rgba(0,255,136,0.1); transform: scale(1.02); }
    </style>
</head>
<body>
    <div class="container py-4">
        <h2 class="text-center mb-4">LỊCH THI ĐẤU CHI TIẾT</h2>
        
        <div class="mb-3">
            <input type="text" id="searchInput" class="form-control" placeholder="Tìm theo đội hoặc vòng...">
        </div>

        <div class="table-responsive">
            <table class="table table-dark table-hover" id="scheduleTable">
                <thead>
                    <tr>
                        <th>Vòng</th>
                        <th>Thời gian</th>
                        <th>Đội nhà</th>
                        <th>Sân vận động</th>
                        <th></th>
                        <th>Đội khách</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Dữ liệu sẽ được chèn bằng JS hoặc backend -->
                </tbody>
            </table>
        </div>

        <div class="text-center mt-4">
            <a href="/" class="btn btn-outline-light">← Quay lại</a>
        </div>
    </div>

    <script>
        const filename = "{{ filename }}";
        let scheduleData = [];

        // Tải dữ liệu từ server
        async function loadSchedule() {
            try {
                const response = await fetch(`/download/${filename}`);
                const data = await response.json();
                scheduleData = data.matches;
                renderTable(scheduleData);
            } catch (error) {
                console.error("Lỗi khi tải dữ liệu:", error);
                alert("Không thể tải dữ liệu lịch thi đấu.");
            }
        }

        // Hiển thị dữ liệu lên bảng
        function renderTable(matches) {
            const tbody = document.querySelector('#scheduleTable tbody');
            tbody.innerHTML = matches.map(m => `
                <tr class="match-row">
                    <td><span class="badge bg-primary">Vòng ${m.round}</span></td>
                    <td>${m.time}</td>
                    <td class="text-end fw-bold">${m.home_team}</td>
                        <td class="text-info"><i class="fas fa-landmark me-1"></i>${m.stadium}</td>
                    <td class="text-center text-success">vs</td>
                    <td class="fw-bold">${m.away_team}</td>
                </tr>
            `).join('');
        }

        // Xử lý tìm kiếm/lọc
        document.getElementById('searchInput').addEventListener('input', (e) => {
            const term = e.target.value.toLowerCase();
            const filtered = scheduleData.filter(m => 
                m.home_team.toLowerCase().includes(term) || 
                m.away_team.toLowerCase().includes(term) ||
                    `vòng ${m.round}`.includes(term) ||
                    m.stadium.toLowerCase().includes(term)
            );
            renderTable(filtered);
        });

        // Khởi chạy khi trang web tải xong
        window.onload = loadSchedule;
    </script>
</body>
</html>
